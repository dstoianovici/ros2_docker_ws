name: ROS

on:
  pull_request:
  push:
  workflow_dispatch:

env:
  ROS_DISTRO: jazzy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg ROS_DISTRO=$ROS_DISTRO -t ci-image -f docker/Dockerfile .
      - name: Build and test workspace
        run: |
          docker run --user root -e AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS=1 -v $GITHUB_WORKSPACE:/ws -w /ws ci-image bash -c "
          vcs import --skip-existing < src/ros2.repos src \
          && apt-get update \
          && rosdep update --rosdistro=$ROS_DISTRO \
          && rosdep install --from-paths src --ignore-src -y --rosdistro=$ROS_DISTRO \
          && colcon build --cmake-args '-DCMAKE_BUILD_TYPE=Release' -Wall -Wextra -Wpedantic \
          && colcon test && colcon test-result --verbose
          "
  lint:
    name: ament_${{ matrix.linter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
          linter: [cppcheck, cpplint, uncrustify, lint_cmake, xmllint, flake8, pep257]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run linter
        run: |
          docker build --build-arg ROS_DISTRO=$ROS_DISTRO -t ci-image -f docker/Dockerfile .
          docker run --user root -e AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS=1 -v $GITHUB_WORKSPACE:/ws -w /ws ci-image bash -c "
          vcs import --skip-existing < src/ros2.repos src \
          && ament_${{ matrix.linter }} src/
          "
